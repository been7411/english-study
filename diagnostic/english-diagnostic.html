<style>
/* Layout: one narrow column like a chart on a clinic clipboard; a sticky step rail on top, one test per screen. */
:root {
  --paper: #F2F5F4;
  --sheet: #FFFFFF;
  --ink: #15201E;
  --ink-2: #4B5B58;
  --ink-3: #788683;
  --rule: #D3DCD9;
  --track: #E4EBE9;
  --accent: #0D5A6A;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBEE;
  --mark: #F2D46A;
  --mark-ink: #2F2604;
  --good: #2B7649;
  --good-soft: #E0EFE5;
  --warn: #9C6210;
  --warn-soft: #F6EAD3;
  --bad: #AE3838;
  --bad-soft: #F5DFDF;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-en: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  --hl-cut: 60%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1514; --sheet: #162120; --ink: #E3ECEA; --ink-2: #A9B8B5; --ink-3: #7F8F8C;
    --rule: #2A3836; --track: #22302E; --accent: #62B4C6; --accent-ink: #062228; --accent-soft: #173A42;
    --mark: #D8BC4E; --mark-ink: #1D1703; --good: #6CC18E; --good-soft: #17301F; --warn: #E0A54B;
    --warn-soft: #34270F; --bad: #EE8080; --bad-soft: #3A1B1B; --hl-cut: 86%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1514; --sheet: #162120; --ink: #E3ECEA; --ink-2: #A9B8B5; --ink-3: #7F8F8C;
  --rule: #2A3836; --track: #22302E; --accent: #62B4C6; --accent-ink: #062228; --accent-soft: #173A42;
  --mark: #D8BC4E; --mark-ink: #1D1703; --good: #6CC18E; --good-soft: #17301F; --warn: #E0A54B;
  --warn-soft: #34270F; --bad: #EE8080; --bad-soft: #3A1B1B; --hl-cut: 86%; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
h1, h2, h3 { line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.hl { background: linear-gradient(transparent var(--hl-cut), var(--mark) var(--hl-cut)); color: inherit; padding: 0 2px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.en { font-family: var(--f-en); }

/* Step rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.rail-inner { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.rail-inner::-webkit-scrollbar { display: none; }
.step { flex: 1 0 auto; display: flex; flex-direction: column; gap: 6px; min-width: 52px; }
.step-bar { height: 4px; border-radius: 2px; background: var(--track); }
.step.done .step-bar { background: var(--accent); }
.step.now .step-bar { background: var(--mark); }
.step-label { font-size: 0.72rem; color: var(--ink-3); white-space: nowrap; }
.step.now .step-label { color: var(--ink); font-weight: 600; }

/* Sheet */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 20px; }
@media (min-width: 600px) { .sheet { padding: 28px 30px; } }
.sec-head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }

/* Buttons & inputs */
button { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 1rem; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
input[type="text"], textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; width: 100%; }
input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
.answer-input { font-family: var(--f-en); font-size: 1.15rem; }

/* Intro list */
.parts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.parts li { display: grid; grid-template-columns: 2rem 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.parts li:last-child { border-bottom: 1px solid var(--rule); }
.parts .n { font-family: var(--f-num); color: var(--ink-3); font-size: 0.9rem; }
.parts .t { min-width: 0; }
.parts .t b { font-weight: 600; }
.parts .m { font-family: var(--f-num); font-size: 0.85rem; color: var(--ink-3); white-space: nowrap; }
.rules { display: grid; gap: 8px; padding: 14px 16px; background: var(--accent-soft); border-radius: 8px; font-size: 0.95rem; }

/* Background form */
.q { display: flex; flex-direction: column; gap: 10px; padding-block: 18px; border-top: 1px solid var(--rule); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q-title { font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span { display: inline-block; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 999px; font-size: 0.93rem; background: var(--sheet); }
.opt input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt input:focus-visible + span { outline: 3px solid var(--mark); outline-offset: 2px; }
.scale-row { display: grid; grid-template-columns: 4.5rem 1fr; gap: 10px; align-items: center; }
.scale-row .opts { gap: 6px; }
.scale-row .opt span { min-width: 40px; text-align: center; padding: 6px 0; font-family: var(--f-num); }

/* Vocab */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.chip { font-family: var(--f-en); font-size: 1.08rem; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); text-align: center; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.counter { font-family: var(--f-num); font-size: 0.9rem; color: var(--ink-2); }

/* Prompt card (production / listening) */
.prompt { padding: 22px 18px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); }
.prompt-ko { font-size: 1.35rem; font-weight: 600; line-height: 1.5; }
.meta-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer { font-family: var(--f-num); font-size: 0.95rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.compare { display: grid; gap: 10px; }
.compare-row { display: grid; grid-template-columns: 4.6rem 1fr; gap: 10px; align-items: baseline; }
.compare-row .lab { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; }
.compare-row .val { font-family: var(--f-en); font-size: 1.08rem; min-width: 0; overflow-wrap: anywhere; }
.point { font-size: 0.92rem; padding: 10px 12px; border-left: 3px solid var(--mark); background: var(--paper); border-radius: 0 6px 6px 0; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade .btn { padding: 0 8px; font-size: 0.93rem; }
.g-ok { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.g-minor { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.g-bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.miss { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 3px; text-decoration: underline; text-decoration-style: wavy; text-underline-offset: 3px; }
.hit { color: var(--ink); }
.plays { display: flex; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--track); }
.dot.used { background: var(--accent); }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 0.93rem; }

/* Reading */
.passage { font-family: var(--f-en); font-size: 1.12rem; line-height: 1.75; display: flex; flex-direction: column; gap: 14px; max-width: 64ch; }
.passage h3 { font-family: var(--f-en); font-size: 1.3rem; }
.mcq { display: flex; flex-direction: column; gap: 8px; padding-block: 14px; border-top: 1px solid var(--rule); }
.mcq .q-title { font-family: var(--f-en); font-size: 1.05rem; font-weight: 600; }
.mcq label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; font-family: var(--f-en); cursor: pointer; }
.mcq label:hover { background: var(--paper); }
.mcq input { margin-top: 6px; accent-color: var(--accent); }

/* Writing */
.countdown { font-family: var(--f-num); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.countdown.low { color: var(--bad); }
.write-area { font-family: var(--f-en); font-size: 1.08rem; min-height: 240px; }

/* Results */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.kpi { padding: 14px 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 0.8rem; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--f-num); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 0.8rem; color: var(--ink-2); }
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter { display: grid; grid-template-columns: 6.5rem 1fr 3rem; gap: 12px; align-items: center; }
.meter .lab { font-size: 0.9rem; font-weight: 600; }
.meter .lab small { display: block; font-weight: 400; color: var(--ink-3); font-size: 0.75rem; }
.meter .val { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 14px; background: var(--track); border-radius: 4px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.fill.recv { background: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.bands { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 150px; padding-top: 10px; }
.band { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.band .bar { width: 70%; max-width: 38px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.band .pct { font-family: var(--f-num); font-size: 0.72rem; color: var(--ink-2); }
.band-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; border-top: 1px solid var(--rule); padding-top: 6px; }
.band-labels span { font-family: var(--f-num); font-size: 0.66rem; color: var(--ink-3); text-align: center; line-height: 1.3; }
.finding { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 16px 0; border-top: 1px solid var(--rule); }
.finding:first-child { border-top: 0; padding-top: 0; }
.tag { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; height: fit-content; letter-spacing: 0.02em; }
.tag-bad { background: var(--bad-soft); color: var(--bad); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-good { background: var(--good-soft); color: var(--good); }
.finding .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rx { font-size: 0.9rem; color: var(--ink-2); }
.rx b { color: var(--ink); font-weight: 600; }
.save-line { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; padding: 12px 14px; border-radius: 8px; background: var(--paper); border: 1px solid var(--rule); }
.save-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); flex: 0 0 auto; }
.save-dot.ok { background: var(--good); }
.save-dot.err { background: var(--bad); }
.save-dot.wait { background: var(--warn); }
.copybox { font-family: var(--f-num); font-size: 0.75rem; min-height: 160px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-size: 0.75rem; color: var(--ink-3); font-weight: 600; }
td.num { text-align: right; }
.foot { margin-top: 28px; font-size: 0.8rem; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
@media (max-width: 480px) {
  h1 { font-size: 1.55rem; }
  .meter { grid-template-columns: 5.4rem 1fr 2.6rem; gap: 8px; }
  .scale-row { grid-template-columns: 3.6rem 1fr; }
  .compare-row { grid-template-columns: 1fr; gap: 2px; }
}
</style>

/* Listening scoring: token alignment with contraction handling */
const NUM_WORDS = { "0": "zero", "1": "one", "2": "two", "3": "three", "4": "four", "5": "five", "6": "six", "7": "seven", "8": "eight", "9": "nine", "10": "ten" };
function tokenize(s) {
  const raw = String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean);
  const out = [];
  for (let w of raw) {
    w = w.replace(/^'+|'+$/g, "");
    if (!w) continue;
    if (NUM_WORDS[w]) { out.push(NUM_WORDS[w]); continue; }
    if (w === "won't") { out.push("will", "not"); continue; }
    if (w === "can't" || w === "cannot") { out.push("can", "not"); continue; }
    if (w === "gonna") { out.push("going", "to"); continue; }
    if (w === "wanna") { out.push("want", "to"); continue; }
    let m;
    if ((m = w.match(/^(.+)n't$/))) { out.push(m[1], "not"); continue; }
    if ((m = w.match(/^(.+)'(ll|ve|re|m|d|s)$/))) {
      const map = { ll: "will", ve: "have", re: "are", m: "am", d: "'d", s: "'s" };
      out.push(m[1], map[m[2]]); continue;
    }
    out.push(w);
  }
  return out;
}
function tokEq(a, b) {
  if (a === b) return true;
  const amb = { "'d": ["had", "would"], "'s": ["is", "has"] };
  if (amb[a] && amb[a].includes(b)) return true;
  if (amb[b] && amb[b].includes(a)) return true;
  return false;
}
function align(refStr, hypStr) {
  const r = tokenize(refStr), h = tokenize(hypStr);
  const n = r.length, m = h.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = tokEq(r[i], h[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Array(n).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (tokEq(r[i], h[j])) { hit[i] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  const missed = r.filter((_, k) => !hit[k]);
  return { ref: r, hit, acc: n ? dp[0][0] / n : 0, missed };
}

}

/* Production: timed Korean → English */

      </form>

/* Listening: speech synthesis dictation */
let voices = [], voice = null;
const ttsOK = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
function loadVoices() {
  if (!ttsOK) return;
  const all = speechSynthesis.getVoices();
  voices = all.filter(v => /^en[-_]/i.test(v.lang));
  if (!voices.length) return;
  const pref = state.listen.voiceName && voices.find(v => v.name === state.listen.voiceName);
  const score = v => (/en[-_]US/i.test(v.lang) ? 4 : /en[-_]GB/i.test(v.lang) ? 2 : 0) + (/(natural|neural|premium|enhanced|samantha|aria|jenny|ava|allison|google us)/i.test(v.name) ? 3 : 0) + (v.localService ? 1 : 0);
  voice = pref || voices.slice().sort((a, b) => score(b) - score(a))[0];
}
if (ttsOK) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (state && state.step === "listen") { const sel = $("#voice"); if (sel && !sel.options.length) render(); } }; }
function speak(text, rate) {
  if (!ttsOK) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : "en-US";
  if (voice) u.voice = voice;
  u.rate = rate;
  speechSynthesis.speak(u);
}

/* ───────────── Scoring ───────────── */

function computeSummary() {
  const s = {};
  // Vocabulary
  const yes = state.vocab.yes;
  const fa = PSEUDO.filter(w => yes[w]).length / PSEUDO.length;
  const bands = VOCAB_BANDS.map(b => {
    const h = b.words.filter(w => yes[w]).length / b.words.length;
    const c = fa >= 1 ? 0 : Math.max(0, (h - fa) / (1 - fa));
    return { label: b.label, width: b.width, raw: Math.round(h * 100), corrected: Math.round(c * 100) };
  });
  const estimate = Math.round(bands.reduce((t, b) => t + b.corrected / 100 * b.width, 0) / 100) * 100;
  s.vocab = { estimate, falseAlarm: Math.round(fa * 100), bands };

  // Production
  const items = state.prod.items.filter(Boolean);
  const pts = { ok: 1, minor: 0.5, bad: 0 };
  const acc = items.length ? Math.round(items.reduce((t, it) => t + (it.answer ? (pts[it.self] || 0) : 0), 0) / PROD.length * 100) : 0;
  const answered = items.filter(it => it.answer);
  const med = median(answered.map(it => it.ms / 1000));
  const medFirst = median(answered.filter(it => it.firstMs != null).map(it => it.firstMs / 1000));
  // speed factor: full credit ≤ 12 s per sentence, half credit at ≥ 30 s (typing included)
  const speed = med == null ? 0 : clamp(1 - (med - 12) / 36, 0.5, 1);
  const failed = items.filter(it => !it.answer || it.self === "bad").map(it => PROD.find(p => p.id === it.id).point);
  s.prod = { acc, medianSec: med == null ? null : Math.round(med * 10) / 10, medianFirstKeySec: medFirst == null ? null : Math.round(medFirst * 10) / 10, auto: Math.round(acc * speed), blanks: items.length - answered.length, failed };

  // Listening
  const L = state.listen;
  if (L.skipped || !L.items.length) s.listen = { skipped: true, acc: null };
  else {
    const li = L.items.filter(Boolean);
    const lacc = Math.round(li.reduce((t, it) => t + it.acc, 0) / LISTEN.length);
    const missed = li.flatMap(it => it.missed);
    const fw = missed.filter(w => FUNCTION_WORDS.has(w)).length;
    s.listen = { skipped: false, acc: lacc, missedWords: missed, functionWordShare: missed.length ? Math.round(fw / missed.length * 100) : 0, avgPlays: Math.round(li.reduce((t, it) => t + it.plays, 0) / li.length * 10) / 10 };
  }

  // Reading
  const R = state.read;
  const correct = QUIZ.filter((q, i) => R.answers[i] === q.a).length;
  const wpm = R.seconds ? Math.round(PASSAGE_WORDS / (R.seconds / 60)) : 0;
  const skimmed = wpm > 600;
  s.read = { seconds: R.seconds, wpm, skimmed, comp: Math.round(correct / QUIZ.length * 100), correct, effective: skimmed ? 0 : Math.round(wpm * correct / QUIZ.length) };

  // Writing
  const W = state.write;
  const words = W.text.trim() ? W.text.trim().split(/\s+/).length : 0;
  const sentences = W.text.split(/[.!?]+/).map(x => x.trim()).filter(x => x.split(/\s+/).length >= 2).length;
  s.write = { words, seconds: W.seconds, wpm: W.seconds ? Math.round(words / (W.seconds / 60) * 10) / 10 : 0, sentences, avgSentenceLen: sentences ? Math.round(words / sentences * 10) / 10 : 0 };

  // Profile (0–100 against reference points)
  s.profile = {
    vocab: Math.round(clamp(estimate / 8000 * 100, 0, 100)),
    read: Math.round(clamp(s.read.effective / 200 * 100, 0, 100)),
    listen: s.listen.skipped ? null : s.listen.acc,
    prod: s.prod.auto,
    write: Math.round(clamp(s.write.wpm / 15 * 100, 0, 100)),
  };
  return s;
}

function findings(s) {
  const out = [];
  const bg = state.bg;
  const V = s.vocab.estimate, P = s.prod, Lx = s.listen, R = s.read, Wr = s.write;
  const receptiveOK = V >= 4000 || R.comp >= 60;

  if (receptiveOK && (P.acc < 70 || (P.medianSec != null && P.medianSec > 20))) {
    out.push({ sev: "bad", tag: "핵심", title: "아는 문법을 바로 꺼내지 못함 (자동화 결손)",
      body: `읽고 이해하는 쪽(어휘 약 ${fmt(V)}, 독해 ${R.comp}%)에 비해 즉석 영작이 약합니다 (정확도 ${P.acc}%, 문장당 ${P.medianSec ?? "–"}초). 규칙을 ‘지식’으로는 아는데 ‘반사’로는 못 쓰는 상태입니다. 시험 위주로 배운 성인에게 가장 흔한 정체 원인입니다.`,
      rx: "<b>순간영작</b>: 한국어 문장을 보고 3초 안에 소리 내어 영어로 말하기, 같은 문장 세트를 막힘 없이 나올 때까지 반복." });
  }
  if (!Lx.skipped && Lx.acc < 85) {
    const fwNote = Lx.functionWordShare >= 45 ? ` 놓친 단어의 ${Lx.functionWordShare}%가 to, have, the, would 같은 기능어입니다. 문장 안에서 약하고 짧게, 붙어서 나오는 소리를 단어로 알아듣지 못하는 패턴입니다.` : "";
    out.push({ sev: Lx.acc < 70 ? "bad" : "warn", tag: Lx.acc < 70 ? "핵심" : "주의", title: "글로는 아는 문장이 소리로는 안 들림",
      body: `쉬운 문장인데도 단어의 ${100 - Lx.acc}%를 놓쳤습니다.${fwNote}`,
      rx: "<b>받아쓰기 + 쉐도잉</b>: 짧은 음원을 받아쓰고, 원문과 비교한 뒤, 같은 속도로 따라 말하기." });
  }
  if (V < 3000) out.push({ sev: "bad", tag: "핵심", title: "기본 어휘가 아직 비어 있음", body: `추정 어휘 약 ${fmt(V)}개. 일상 대화와 쉬운 영상의 95%를 알아들으려면 약 3,000 단어족이 필요합니다.`, rx: "<b>고빈도 3,000 단어</b>를 간격 반복(Anki)으로, 예문과 소리까지 함께." });
  else if (V < 6000) out.push({ sev: "warn", tag: "주의", title: "어휘 중간 구간", body: `추정 어휘 약 ${fmt(V)}개. 기본은 있지만 영화·원서를 편하게 보려면 6,000–9,000개가 필요합니다. 이 구간은 단어장보다 많이 읽고 듣는 쪽이 효율적입니다.`, rx: "<b>다독·다청</b>: 모르는 단어가 2% 이하인 쉬운 자료를 많이." });
  else out.push({ sev: "good", tag: "강점", title: "어휘량은 충분한 편", body: `추정 어휘 약 ${fmt(V)}개. 어휘가 정체의 원인은 아닙니다.`, rx: "새 단어를 외우기보다 아는 단어를 말과 글로 꺼내는 연습에 시간을 쓰세요." });
  if (R.wpm && R.wpm < 150 && R.comp >= 60) out.push({ sev: "warn", tag: "주의", title: "느린 읽기 (머릿속 번역 습관 가능성)", body: `분당 ${R.wpm}단어. 이해는 되는데 느리다면 영어를 한국어로 옮겨서 이해하는 습관일 수 있습니다. 원어민 성인 묵독은 분당 약 240단어입니다.`, rx: "<b>쉬운 책 빠르게 읽기</b>: 수준보다 한 단계 쉬운 책으로 되돌아가지 않고 앞에서부터." });
  if (R.comp < 60) out.push({ sev: "warn", tag: "주의", title: "독해 정확도 부족", body: `이해도 ${R.comp}%. 문장 구조를 잡는 데 시간이 걸리거나 모르는 단어가 많아 흐름을 놓치고 있습니다.`, rx: "수준에 맞는 지문으로 <b>정독 후 다독</b>." });
  if (Wr.words && Wr.wpm < 8) out.push({ sev: "warn", tag: "주의", title: "쓰기 출력량이 적음", body: `5분 동안 ${Wr.words}단어 (분당 ${Wr.wpm}). 쓸 내용보다 영어 문장을 조립하는 데 시간이 많이 듭니다.`, rx: "<b>매일 5분 자유 작문</b> + 교정받은 문장을 다시 써 보기." });
  if (["거의 0", "1시간 미만"].includes(bg.weekly)) out.push({ sev: "bad", tag: "핵심", title: "영어에 노출되는 시간이 절대적으로 적음", body: "주 1시간 미만이면 1년에 50시간 남짓입니다. 언어는 이해할 수 있는 입력이 쌓인 시간만큼 늡니다. 방법보다 먼저 시간이 부족합니다.", rx: "출퇴근·운동·집안일 시간을 <b>영어 듣기</b>로 바꿔 주 5시간부터." });
  if (["1개월 미만", "1–3개월"].includes(bg.streak)) out.push({ sev: "warn", tag: "주의", title: "시작과 중단의 반복", body: "한 방법을 3개월 이상 이어 간 적이 없다면, 어떤 방법도 효과가 나기 전에 멈춘 것입니다.", rx: "<b>하루 15분 최소 단위</b>를 정하고 매일 기록. 의지가 아니라 장치로." });
  if (s.vocab.falseAlarm > 20) out.push({ sev: "warn", tag: "주의", title: "‘본 적 있는’ 단어를 ‘아는’ 단어로 착각하는 경향", body: `가짜 단어의 ${s.vocab.falseAlarm}%를 안다고 골랐습니다. 어휘 점수는 이만큼 깎아서 계산했습니다. 눈에 익은 것과 쓸 수 있는 것의 차이가 크다는 뜻입니다.`, rx: "단어를 볼 때 <b>뜻을 소리 내어 말해 보는</b> 습관." });
  const order = { bad: 0, warn: 1, good: 2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ───────────── Results ───────────── */

function copyText(s) {
  const st = state;
  const lines = [];
  lines.push(`[영어 정체 진단 결과] ${st.startedAt.slice(0, 10)} (id ${st.id})`);
  lines.push(`배경: ${JSON.stringify(st.bg)}`);
  lines.push(`어휘: 추정 ${s.vocab.estimate}, 가짜단어 오답 ${s.vocab.falseAlarm}%, 밴드별 ${s.vocab.bands.map(b => b.label + ":" + b.raw + "%").join(" ")}`);
  lines.push(`즉석영작: 정확도 ${s.prod.acc}%, 중앙값 ${s.prod.medianSec}초, 첫 키 ${s.prod.medianFirstKeySec}초`);
  st.prod.items.forEach(it => { if (it) { const p = PROD.find(x => x.id === it.id); lines.push(`  ${p.ko} → ${it.answer || "(빈칸)"} [${it.self}, ${(it.ms / 1000).toFixed(1)}s]`); } });
  if (s.listen.skipped) lines.push("듣기: 건너뜀");
  else { lines.push(`듣기: ${s.listen.acc}%, 기능어 비중 ${s.listen.functionWordShare}%`); st.listen.items.forEach(it => { if (it) { const l = LISTEN.find(x => x.id === it.id); lines.push(`  ${l.text} → ${it.typed || "(빈칸)"} [${it.acc}%, ${it.plays}회]`); } }); }
  lines.push(`읽기: ${s.read.wpm} wpm, 이해 ${s.read.correct}/${QUIZ.length}, 답 ${JSON.stringify(st.read.answers)}`);
  lines.push(`쓰기: ${s.write.words}단어 / ${s.write.seconds}초`);
  lines.push(`작문: ${st.write.text}`);
  return lines.join("\n");
}

function refreshSaveLine() {
  const el = $("#save-line"); if (!el) return;
  el.innerHTML = saveLineHtml();
}
function saveLineHtml() {
  if (saveState === "ok") return `<span class="save-dot ok"></span><span>결과가 저장되었습니다. Claude와의 대화로 돌아가 <b>“진단 끝났어”</b>라고 말하면, 작성한 문장과 받아쓰기까지 직접 채점해서 처방을 드립니다.</span>`;
  if (saveState === "err") return `<span class="save-dot err"></span><span>저장에 실패했습니다 (${esc(saveErr)}). 아래 ‘결과 복사’를 눌러 Claude와의 대화에 붙여 넣어 주세요.</span>`;
  if (saveState === "off") return `<span class="save-dot"></span><span>이 화면에서는 자동 저장이 되지 않습니다. 아래 ‘결과 복사’를 눌러 Claude와의 대화에 붙여 넣어 주세요.</span>`;
  return `<span class="save-dot wait"></span><span>저장하는 중…</span>`;
}

function renderResults() {
  const s = computeSummary();
  const f = findings(s);
  const pr = s.profile;
  const meters = [
    { k: "어휘량", sub: "기준 8,000", v: pr.vocab, recv: true, tip: `추정 ${fmt(s.vocab.estimate)}개 (원서·영화 98% 이해 ≈ 8,000)` },
    { k: "읽기", sub: "기준 200wpm", v: pr.read, recv: true, tip: `${s.read.wpm} wpm × 이해 ${s.read.comp}%` },
    { k: "듣기", sub: "받아쓰기", v: pr.listen, recv: false, tip: s.listen.skipped ? "건너뜀" : `단어 ${s.listen.acc}% 인식` },
    { k: "즉석 영작", sub: "정확도×속도", v: pr.prod, recv: false, tip: `정확도 ${s.prod.acc}% · 문장당 ${s.prod.medianSec ?? "–"}초` },
    { k: "쓰기", sub: "기준 15단어/분", v: pr.write, recv: false, tip: `${s.write.words}단어 / ${Math.round((s.write.seconds || 0) / 6) / 10}분` },
  ];
  const recvAvg = Math.round((pr.vocab + pr.read) / 2);
  const prodVals = [pr.prod, pr.write].concat(pr.listen == null ? [] : [pr.listen]);
  const prodAvg = Math.round(prodVals.reduce((a, b) => a + b, 0) / prodVals.length);
  const gap = recvAvg - prodAvg;
  const maxBand = 100;

  $("#app").innerHTML = `
  <section class="sheet stack-lg">
    <div class="sec-head"><span class="eyebrow">결과 · ${esc(state.startedAt.slice(0, 10))}</span>
      <h1>${gap >= 20 ? `<span class="hl">아는 것</span>과 <span class="hl">쓰는 것</span>의 차이가 ${gap}점` : gap <= -10 ? "말과 소리가 글보다 앞서 있습니다" : "영역 간 차이가 크지 않습니다"}</h1>
      <p class="muted">${gap >= 20 ? "눈으로 읽고 이해하는 능력(회색)에 비해 소리를 듣고, 바로 말하고, 쓰는 능력(청록)이 크게 뒤처져 있습니다. 오래 공부했는데 늘지 않는다고 느끼는 사람에게 가장 흔한 모양입니다." : "각 영역의 점수와 아래 진단을 함께 보세요."}</p>
    </div>

    <div class="kpis">
      <div class="kpi"><span class="k">추정 어휘</span><span class="v">${fmt(s.vocab.estimate)}</span><span class="s">단어족</span></div>
      <div class="kpi"><span class="k">즉석 영작</span><span class="v">${s.prod.acc}%</span><span class="s">문장당 ${s.prod.medianSec ?? "–"}초</span></div>
      <div class="kpi"><span class="k">받아쓰기</span><span class="v">${s.listen.skipped ? "–" : s.listen.acc + "%"}</span><span class="s">${s.listen.skipped ? "건너뜀" : "단어 인식률"}</span></div>
      <div class="kpi"><span class="k">읽기 속도</span><span class="v">${s.read.wpm}</span><span class="s">${s.read.skimmed ? "너무 빨라 측정 무효" : `wpm · 이해 ${s.read.correct}/${QUIZ.length}`}</span></div>
      <div class="kpi"><span class="k">작문</span><span class="v">${s.write.words}</span><span class="s">단어 / 5분</span></div>
    </div>

    <div class="stack">
      <div class="meta-row"><h3>영역별 프로필</h3><div class="legend"><span><i style="background:var(--ink-3)"></i>이해 (입력)</span><span><i style="background:var(--accent)"></i>소리·산출</span></div></div>
      <div class="meters">${meters.map(m => `
        <div class="meter" title="${esc(m.tip)}">
          <span class="lab">${m.k}<small>${m.sub}</small></span>
          <div class="track" role="img" aria-label="${m.k} ${m.v == null ? "측정 안 함" : m.v + "점"}">${m.v == null ? "" : `<div class="fill ${m.recv ? "recv" : ""}" style="width:${m.v}%"></div>`}</div>
          <span class="val">${m.v == null ? "–" : m.v}</span>
        </div>`).join("")}</div>
      <p class="small muted">각 막대는 참고 기준 대비 점수(100 = 기준 도달)입니다. 막대에 마우스를 올리면 원래 수치가 보입니다.</p>
    </div>

    <div class="stack">
      <h3>진단</h3>
      <div>${f.map(x => `
        <div class="finding"><span class="tag tag-${x.sev}">${x.tag}</span>
          <div class="body"><b>${esc(x.title)}</b><p class="small">${esc(x.body)}</p><p class="rx">처방 방향 · ${x.rx}</p></div>
        </div>`).join("")}</div>
    </div>

    <div class="stack">
      <h3>어휘 빈도대별 인지율</h3>
      <div>
        <div class="bands">${s.vocab.bands.map(b => `<div class="band" title="${b.label}위: ${b.raw}% 선택 → 보정 ${b.corrected}%"><span class="pct">${b.corrected}%</span><div class="bar" style="height:${Math.max(1, b.corrected / maxBand * 100)}%"></div></div>`).join("")}</div>
        <div class="band-labels">${s.vocab.bands.map(b => `<span>${b.label}</span>`).join("")}</div>
      </div>
      <p class="small muted">빈도 순위 구간별로 아는 비율 (가짜 단어 ${s.vocab.falseAlarm}% 오선택을 반영해 보정). 보통 낮은 구간에서 높은 구간으로 갈수록 떨어지며, 급격히 꺾이는 지점이 현재 어휘의 경계입니다.</p>
    </div>

    ${s.prod.failed.length ? `<div class="stack"><h3>막힌 문장 구조</h3><ul class="small" style="margin:0;padding-left:1.2em;display:grid;gap:4px">${s.prod.failed.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}

    <div class="stack">
      <div class="save-line" id="save-line">${saveLineHtml()}</div>
      <div class="row">
        <button class="btn btn-ghost" id="copy">결과 복사</button>
        <button class="btn btn-ghost" id="again">새로 진단하기</button>
      </div>
      <textarea class="copybox" id="copybox" readonly hidden></textarea>
    </div>
    <p class="small muted">이 화면의 진단은 자동 규칙으로 만든 1차 판정입니다. 즉석 영작과 작문은 스스로 채점한 결과라서, Claude가 실제 답안을 다시 채점하고 4주 처방을 만듭니다. 4주 뒤 같은 진단을 다시 하면 위 표에 기록이 쌓입니다.</p>
  </section>`;

  $("#copy").onclick = () => {
    const text = copyText(s);
    const box = $("#copybox");
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); $("#copy").textContent = "아래 글을 길게 눌러 복사하세요"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { $("#copy").textContent = "복사됨"; }).catch(fallback);
    } else fallback();
  };
  $("#again").onclick = () => {
    const btn = $("#again");
    if (!btn.dataset.confirm) { btn.dataset.confirm = "1"; btn.textContent = "한 번 더 누르면 새로 시작"; return; }
    state = blankState(); saveLocal(); go("intro");
  };
}

/* ───────────── Boot ───────────── */

function start(data) {
  state = (data && data.state) || loadLocal() || blankState();
  if (!state.listen.voiceName) state.listen.voiceName = null;
  render();
  setFoot();
  initDb();
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
  window.claude.hot.snapshot(() => ({ state }));
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === "function") window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
