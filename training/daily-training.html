.foot { margin-top: 24px; font-size: 0.8rem; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }

function stopActive() {
  if (activeStart == null) return;
  const s = session(today()); s.activeSec = (s.activeSec || 0) + Math.round((Date.now() - activeStart) / 1000); activeStart = null; persist("session", today());
}
function go(name, extra) { stopActive(); if (ttsOK) speechSynthesis.cancel(); view = Object.assign({ name }, extra || {}); render(); window.scrollTo(0, 0); }
function rateSeg() {
  const r = (progress.prefs && progress.prefs.rate) || 1;
  return `<div class="seg" role="group" aria-label="음성 속도">${[0.85, 1, 1.15].map(v => `<button type="button" data-rate="${v}" aria-pressed="${r === v ? "true" : "false"}">${v === 1 ? "1.0" : v}×</button>`).join("")}</div>`;
}
function bindRate() {
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
    progress.prefs = progress.prefs || {}; progress.prefs.rate = Number(b.dataset.rate); persist("progress");
    document.querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  });
}
const doneCount = s => s ? [s.ear.done, s.mouth.done, s.flow.done].filter(Boolean).length : 0;

/* ───────────── Views ───────────── */

function render() {
  ({ home: renderHome, ear: renderEar, mouth: renderMouth, flow: renderFlow, write: renderWrite }[view.name] || renderHome)();
}

function renderHome() {
  const d = today();
  const s = sessions[d];
  const setNo = progress.assign[d] || (progress.next <= SETS.length ? progress.next : null);
  const set = setNo ? SETS[setNo - 1] : null;
  const daysDone = Object.values(sessions).filter(x => doneCount(x) > 0).length;
  let streak = 0, cur = doneCount(s) > 0 ? d : addDays(d, -1);
  while (doneCount(sessions[cur]) > 0) { streak++; cur = addDays(cur, -1); }
  const known = Object.values(progress.cards).filter(c => c.b >= 3).length;
  const dueN = allCards().filter(c => progress.cards[c.id] && progress.cards[c.id].due <= d).length;
  const cal = Array.from({ length: 28 }, (_, k) => addDays(d, k - 27)).map(day => {
    const n = doneCount(sessions[day]);
    return `<i class="${n === 3 ? "full" : n > 0 ? "part" : ""} ${day === d ? "today" : ""}" title="${day}: ${n}/3"></i>`;
  }).join("");
  const recent = Object.values(sessions).filter(x => doneCount(x) > 0).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
  const finished = progress.next > SETS.length && !progress.assign[d];
  const step = (n, key, title, sub, label) => {
    const done = s && s[key].done;
    return `<div class="stepline ${done ? "done" : ""}"><span class="n">${done ? "✓" : n}</span><span class="t"><b>${title}</b><span>${sub}</span></span><button class="btn ${done ? "btn-ghost btn-sm" : "btn-primary btn-sm"}" data-go="${key}">${done ? "다시" : label}</button></div>`;
  };

  $("#app").innerHTML = `
  <section class="sheet stack-lg">
    <div class="stack-sm">
      <span class="eyebrow">${progress.startedOn ? `${daysDone}일째 · ${esc(d)}` : "첫날 · " + esc(d)}</span>
      <h1>오늘의 30분: <span class="hl">듣고, 받아쓰고, 말하기</span></h1>
      <p class="muted small">진단 결론: 아는 영어를 실시간으로 꺼내지 못하는 상태. 새로 외우지 않고, 이미 아는 문장을 귀와 입으로 옮깁니다. 모든 문장은 반드시 소리 내어.</p>
    </div>

    <div class="stats">
      <div class="stat"><span class="k">연속</span><span class="v">${streak}</span><span class="s">일</span></div>
      <div class="stat"><span class="k">입에 붙은 문장</span><span class="v">${known}</span><span class="s">/ ${allCards().length}</span></div>
      <div class="stat"><span class="k">복습 대기</span><span class="v">${dueN}</span><span class="s">문장</span></div>
    </div>

    ${set ? `<div class="set-card">
      <span class="eyebrow">세트 ${setNo} / ${SETS.length}${progress.assign[d] ? "" : " · 시작하면 열림"}</span>
      <h2>${esc(set.t)}</h2>
      <p class="tip">${esc(set.tip)}</p>
    </div>` : finished ? `<div class="ok-box">20세트를 모두 열었습니다. 이제는 복습만 나옵니다. <b>재진단할 때입니다.</b> Claude에게 “재진단하자”고 말하세요.</div>` : ""}

    <div class="steps">
      ${step(1, "ear", "귀 · 받아쓰기와 따라 말하기", "오늘 문장을 소리로 먼저 듣고 적은 뒤, 같은 속도로 3번 따라 말하기 · 10분", "시작")}
      ${step(2, "mouth", "입 · 순간영작", "한국어를 보고 5초 안에 소리 내어 영어로 · 오늘 문장과 복습 · 10분", "시작")}
      ${step(3, "flow", "흐름 · 음원에 맞춰 읽기", "BBC 6 Minute English 대본 보며 멈추지 않고 1번, 대본 없이 1번 · 10분", "시작")}
    </div>
    ${!ttsOK ? `<div class="notice">이 화면에서는 음성이 나오지 않습니다. 휴대폰 Safari·Chrome이나 PC 브라우저에서 이 링크를 열어 주세요. 기록은 저장소를 통해 이어집니다.</div>` : ""}

    <div class="stack-sm">
      <div class="between"><h3>최근 4주</h3><div class="legend"><span><i></i>안 함</span><span><i class="part"></i>일부</span><span><i class="full"></i>3단계 모두</span></div></div>
      <div class="cal">${cal}</div>
    </div>

    ${recent.length ? `<div class="stack-sm"><h3>최근 기록</h3><div class="tbl-wrap"><table>
      <thead><tr><th>날짜</th><th>세트</th><th class="num">받아쓰기</th><th class="num">바로 나옴</th><th>흐름</th><th class="num">시간</th></tr></thead>
      <tbody>${recent.map(x => {
        const ea = x.ear.items.length ? Math.round(x.ear.items.reduce((t, it) => t + it.acc, 0) / x.ear.items.length) + "%" : "–";
        const mt = x.mouth.fast + x.mouth.slow + x.mouth.fail;
        return `<tr><td>${esc(x.date.slice(5))}</td><td>${x.set || "복습"}</td><td class="num">${ea}</td><td class="num">${mt ? Math.round(x.mouth.fast / mt * 100) + "%" : "–"}</td><td>${x.flow.done ? "✓" : "–"}</td><td class="num">${Math.round((x.activeSec || 0) / 60)}분</td></tr>`;
      }).join("")}</tbody></table></div></div>` : ""}

    <div class="between" style="padding-top:4px;border-top:1px solid var(--rule)">
      <div class="stack-sm" style="gap:2px;padding-top:12px"><b>주간 작문</b><span class="small muted">일요일 5분. 쓰고, Claude에게 교정받고, 교정된 문장을 카드로.</span></div>
      <button class="btn btn-ghost btn-sm" data-go="write" style="margin-top:12px">작문하기</button>
    </div>
  </section>`;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const k = b.dataset.go, cur = sessions[d];
    if (cur && k === "ear" && cur.ear.done) { cur.ear.i = 0; cur.ear.items = []; }
    if (cur && k === "mouth" && cur.mouth.done) { go("mouth", { practice: true, pi: 0 }); return; }
    go(k);
  });
}

/* Ear: dictation → compare → shadow ×3 */
function renderEar() {
  const s = ensureTodaySet();
  const E = s.ear;
  if (!E.queue) { E.queue = earQueue(s); E.i = 0; E.items = []; persist("session", s.date); }
  if (!E.queue.length) { $("#app").innerHTML = `<section class="sheet stack"><h2>들을 문장이 없습니다</h2><button class="btn btn-ghost" id="back">돌아가기</button></section>`; $("#back").onclick = () => go("home"); return; }
  if (activeStart == null) startActive();
  if (E.i >= E.queue.length) {
    E.done = true; persist("session", s.date); stopActive();
    const acc = Math.round(E.items.reduce((t, it) => t + it.acc, 0) / Math.max(1, E.items.length));
    $("#app").innerHTML = `<section class="sheet stack"><span class="eyebrow">귀 · 완료</span><h2>평균 ${acc}% 들었습니다</h2>
      <p class="muted small">놓친 단어는 대부분 짧고 약하게 발음되는 단어일 겁니다. 그 소리를 입으로 낼 수 있어야 귀에도 들립니다.</p>
      <div class="row"><button class="btn btn-primary" id="next">다음: 입</button><button class="btn btn-ghost" id="home">홈</button></div></section>`;
    $("#next").onclick = () => go("mouth"); $("#home").onclick = () => go("home"); return;
  }
  const card = cardById(E.queue[E.i]);
  if (!card) { E.i++; persist("session", s.date); render(); return; }
  const item = E.items[E.i];
  const prog = `<div class="progress"><div style="width:${E.i / E.queue.length * 100}%"></div></div>`;
  if (!item) {
    $("#app").innerHTML = `
    <section class="sheet stack">
      <div class="topbar"><span class="eyebrow">1 귀 · 받아쓰기</span><span class="counter">${E.i + 1} / ${E.queue.length}</span></div>${prog}
      <p class="muted small">먼저 듣고 들린 대로 적습니다. 3번까지 들어도 됩니다. 철자는 틀려도 괜찮습니다.</p>
      <div class="between"><button class="btn btn-primary" id="play">▶ 듣기</button>${rateSeg()}</div>
      <form id="f" class="stack" autocomplete="off">
        <input type="text" class="answer-input" id="ans-${card.id}" placeholder="들린 문장을 입력 후 Enter" spellcheck="false" autocomplete="off" autocapitalize="sentences">
        <div class="row"><button class="btn btn-primary" type="submit">확인</button><button class="btn btn-ghost" type="button" id="none">못 들었어요</button><span class="counter" id="plays">0회 들음</span></div>
      </form>
      <button class="btn btn-ghost btn-sm" id="home" style="align-self:flex-start">그만하고 홈으로</button>
    </section>`;
    bindRate();
    let plays = 0;
    $("#play").onclick = () => { plays++; speak(card.en); $("#plays").textContent = plays + "회 들음"; $("#ans-" + card.id).focus(); };
    const submit = typed => {
      const res = align(card.en, typed);
      E.items[E.i] = { id: card.id, typed, plays, acc: Math.round(res.acc * 100), missed: res.missed, shadow: 0 };
      persist("session", s.date); render();
    };
    $("#f").addEventListener("submit", e => { e.preventDefault(); submit($("#ans-" + card.id).value.trim()); });
    $("#none").onclick = () => submit("");
    $("#home").onclick = () => go("home");
  } else {
    const res = align(card.en, item.typed);
    $("#app").innerHTML = `
    <section class="sheet stack">
      <div class="topbar"><span class="eyebrow">1 귀 · 따라 말하기</span><span class="counter">${E.i + 1} / ${E.queue.length}</span></div>${prog}
      <div class="prompt">
        <div class="compare">
          <div class="compare-row"><span class="lab">내가 들은 것</span><span class="val">${item.typed ? esc(item.typed) : '<span class="muted">(못 들음)</span>'}</span></div>
          <div class="compare-row"><span class="lab">원문</span><span class="val">${markOriginal(card.en, res.hit)}</span></div>
          <div class="compare-row"><span class="lab">뜻</span><span class="val" style="font-family:var(--f-ui);font-size:0.95rem">${esc(card.ko)}</span></div>
        </div>
      </div>
      <p class="small muted">원문을 보면서 들려주는 속도 그대로 3번 따라 말하세요. 밑줄 친 부분은 특히 소리를 흉내 내듯이. 마지막 한 번은 원문을 안 보고.</p>
      <div class="between">
        <div class="row"><button class="btn btn-primary" id="sh">▶ 듣고 따라 말하기</button><div class="shadow-dots" id="dots">${[0, 1, 2].map(k => `<i class="${k < item.shadow ? "on" : ""}"></i>`).join("")}</div></div>
        ${rateSeg()}
      </div>
      <div class="row"><button class="btn ${item.shadow >= 3 ? "btn-primary" : "btn-ghost"}" id="next">${E.i + 1 < E.queue.length ? "다음 문장" : "끝내기"}</button></div>
    </section>`;
    bindRate();
    $("#sh").onclick = () => {
      speak(card.en); item.shadow = (item.shadow || 0) + 1; persist("session", s.date);
      $("#dots").innerHTML = [0, 1, 2].map(k => `<i class="${k < item.shadow ? "on" : ""}"></i>`).join("");
      if (item.shadow >= 3) { $("#next").className = "btn btn-primary"; }
    };
    $("#next").onclick = () => { E.i++; persist("session", s.date); render(); window.scrollTo(0, 0); };
  }
}

/* Mouth: Korean → say it aloud within 5 s → reveal + audio → self-grade */
function renderPractice() {
  const s = session(today());
  const ids = s.set ? CARDS.filter(c => c.set === s.set).map(c => c.id) : (s.mouth.queue || []);
  if (view.pi >= ids.length) { go("home"); return; }
  const card = cardById(ids[view.pi]);
  $("#app").innerHTML = `
  <section class="sheet stack">
    <div class="topbar"><span class="eyebrow">입 · 다시 연습 (기록 안 함)</span><span class="counter">${view.pi + 1} / ${ids.length}</span></div>
    <div class="prompt"><div class="prompt-ko">${esc(card.ko)}</div>${view.revealed ? `<div class="prompt-en">${esc(card.en)}</div>` : `<div class="countdown" aria-hidden="true"><div></div></div>`}</div>
    <div class="row">${view.revealed ? `<button class="btn btn-primary" id="nx">다음</button><button class="btn btn-ghost" id="ag">▶ 다시 듣기</button>` : `<button class="btn btn-primary" id="rv">말했어요 · 정답 보기</button>`}<button class="btn btn-ghost btn-sm" id="home">홈으로</button></div>
  </section>`;
  if (view.revealed) { speak(card.en); $("#ag").onclick = () => speak(card.en); $("#nx").onclick = () => { view.pi++; view.revealed = false; render(); }; }
  else $("#rv").onclick = () => { view.revealed = true; render(); };
  $("#home").onclick = () => go("home");
}

function renderMouth() {
  if (view.practice) { renderPractice(); return; }
  const s = ensureTodaySet();
  const M = s.mouth;
  if (!M.queue) { M.queue = mouthQueue(s); M.i = 0; M.fast = 0; M.slow = 0; M.fail = 0; persist("session", s.date); }
  if (activeStart == null) startActive();
  if (M.i >= M.queue.length) {
    M.done = true; persist("session", s.date); persist("progress"); stopActive();
    const n = M.fast + M.slow + M.fail;
    $("#app").innerHTML = `<section class="sheet stack"><span class="eyebrow">입 · 완료</span><h2>${n}문장 중 ${M.fast}문장이 바로 나왔습니다</h2>
      <p class="muted small">못 나온 문장은 내일, 늦게 나온 문장은 곧 다시 나옵니다. 바로 나온 문장은 간격이 점점 벌어집니다 (1 → 2 → 4 → 7 → 14 → 30일).</p>
      <div class="row"><button class="btn btn-primary" id="next">다음: 흐름</button><button class="btn btn-ghost" id="home">홈</button></div></section>`;
    $("#next").onclick = () => go("flow"); $("#home").onclick = () => go("home"); return;
  }
  const card = cardById(M.queue[M.i]);
  if (!card) { M.i++; persist("session", s.date); render(); return; }
  const isNew = !progress.cards[card.id];
  const prog = `<div class="progress"><div style="width:${M.i / M.queue.length * 100}%"></div></div>`;
  if (!view.revealed) {
    $("#app").innerHTML = `
    <section class="sheet stack">
      <div class="topbar"><span class="eyebrow">2 입 · 순간영작${isNew ? " · 새 문장" : " · 복습"}</span><span class="counter">${M.i + 1} / ${M.queue.length}</span></div>${prog}
      <div class="prompt"><div class="prompt-ko">${esc(card.ko)}</div><div class="countdown" aria-hidden="true"><div></div></div></div>
      <p class="small muted">노란 막대가 사라지기 전에 <b>소리 내어</b> 영어로 말하세요. 완벽하지 않아도 끝까지. 말한 뒤 정답을 봅니다.</p>
      <div class="row"><button class="btn btn-primary" id="reveal">말했어요 · 정답 보기</button><button class="btn btn-ghost btn-sm" id="home">홈으로</button></div>
    </section>`;
    view.shownAt = Date.now();
    $("#reveal").onclick = () => { view.revealed = true; view.took = Date.now() - view.shownAt; render(); };
    $("#home").onclick = () => go("home");
  } else {
    $("#app").innerHTML = `
    <section class="sheet stack">
      <div class="topbar"><span class="eyebrow">2 입 · 순간영작</span><span class="counter">${M.i + 1} / ${M.queue.length}</span></div>${prog}
      <div class="prompt"><div class="prompt-ko" style="font-size:1.05rem;font-weight:500;color:var(--ink-2)">${esc(card.ko)}</div><div class="prompt-en">${esc(card.en)}</div></div>
      <div class="between"><button class="btn btn-ghost btn-sm" id="again">▶ 다시 듣기</button>${rateSeg()}</div>
      <p class="small muted">정답을 한 번 소리 내어 따라 말한 뒤 채점하세요. ${(view.took / 1000).toFixed(1)}초 걸렸습니다.</p>
      <div class="grade">
        <button class="btn g-ok" data-g="fast">바로 나옴<small>5초 안에</small></button>
        <button class="btn g-minor" data-g="slow">늦게·일부<small>막힘·작은 실수</small></button>
        <button class="btn g-bad" data-g="fail">못 나옴<small>구조 틀림</small></button>
      </div>
    </section>`;
    bindRate();
    speak(card.en);
    $("#again").onclick = () => speak(card.en);
    document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
      const g = b.dataset.g; grade(card.id, g); M[g]++; M.i++;
      view.revealed = false; persist("session", s.date);
      if (M.i % 5 === 0) persist("progress");
      render();
    });
  }
}

/* Flow: external audio-paced reading */
function renderFlow() {
  const s = session(today());
  const F = s.flow;
  if (activeStart == null) startActive();
  $("#app").innerHTML = `
  <section class="sheet stack">
    <span class="eyebrow">3 흐름 · 음원에 맞춰 읽기</span>
    <h2>되돌아갈 수 없는 속도로 앞에서부터</h2>
    <p class="muted small">진단에서 긴 문장일수록 앞부분이 휘발됐습니다. 문장을 끝까지 담았다가 거꾸로 해석하는 습관 때문입니다. 음원 속도에 맞춰 읽으면 되돌아갈 수 없으니, 들어오는 순서대로 이해하는 회로가 생깁니다.</p>
    <ol class="method">
      <li><a class="link" href="https://www.bbc.co.uk/learningenglish/english/features/6-minute-english" target="_blank" rel="noopener">BBC Learning English · 6 Minute English</a>에서 에피소드 하나를 고릅니다 (지난 회차부터 차례로 해도 됩니다).</li>
      <li><b>1회차</b>: 대본을 보면서 음원을 멈추지 않고 끝까지 듣습니다. 놓쳐도 되돌아가지 않습니다.</li>
      <li><b>2회차</b>: 대본 없이 다시 듣습니다. 처음보다 들리는 부분이 늘어난 걸 확인합니다.</li>
      <li>출퇴근·운동 중에 같은 에피소드를 한 번 더 들으면 주간 노출 시간이 늘어납니다 (공부 시간 추가 없이).</li>
    </ol>
    <div class="stack-sm">
      <label class="small muted" for="ep">들은 에피소드 제목 (선택)</label>
      <input type="text" id="ep" value="${esc(F.episode)}" placeholder="예: Is it OK to be lazy?">
    </div>
    <div class="stack-sm">
      <label class="small muted" for="xm">오늘 공부 시간 밖에서 영어를 들은 시간 (분)</label>
      <input type="number" id="xm" min="0" max="600" inputmode="numeric" value="${F.extraMin || 0}">
    </div>
    <label class="check" for="ck"><input type="checkbox" id="ck" ${F.done ? "checked" : ""}><span>대본 보며 1번, 대본 없이 1번 들었다</span></label>
    <div class="row"><button class="btn btn-primary" id="save">기록하고 홈으로</button></div>
  </section>`;
  $("#save").onclick = () => {
    F.episode = $("#ep").value.trim(); F.extraMin = Math.max(0, Math.min(600, Number($("#xm").value) || 0)); F.done = $("#ck").checked;
    persist("session", s.date); go("home");
  };
}

/* Weekly writing with Claude feedback */
let writeTimer = null, writeCtl = null;
function renderWrite() {
  const topic = WRITE_TOPICS[Math.floor((Date.now() / 6048e5)) % WRITE_TOPICS.length];
  const draft = lsGet("e2m-draft", "");
  const last = writings[0];
  $("#app").innerHTML = `
  <section class="sheet stack">
    <div class="topbar"><span class="eyebrow">주간 작문</span><button class="btn btn-ghost btn-sm" id="home">홈으로</button></div>
    <h2>5분 동안 멈추지 말고 쓰기</h2>
    <p class="muted small">이번 주 주제: <b>${esc(topic)}</b>. 사전·번역기 없이. 진단에서 자유 작문의 과거시제는 대체로 맞았습니다. 오늘은 관사(a, the)와 had를 의식하며 써 보세요.</p>
    <div class="between"><span class="counter" id="wc">0단어</span><div class="row"><span class="counter" id="tm">5:00</span><button class="btn btn-ghost btn-sm" id="timer">타이머 시작</button></div></div>
    <textarea id="wt" class="en" style="min-height:220px;font-size:1.05rem" spellcheck="false" autocapitalize="sentences" placeholder="This week, I…">${esc(draft)}</textarea>
    <div class="row">
      <button class="btn btn-primary" id="fbk" ${sample ? "" : "hidden"}>Claude에게 교정받기</button>
      <button class="btn ${sample ? "btn-ghost" : "btn-primary"}" id="copy">글 복사</button>
      <button class="btn btn-ghost" id="stop" hidden>멈추기</button>
    </div>
    <p class="small muted" id="msg">${sample ? "교정은 당신의 Claude 사용량을 씁니다. 처음 한 번은 허락을 묻습니다." : "이 화면에서는 바로 교정을 받을 수 없습니다. ‘글 복사’ 후 Claude와의 대화에 붙여 넣어 주세요."}</p>
    <div id="fb"></div>
    ${writings.length ? `<div class="stack-sm"><h3>지난 작문</h3>${writings.slice(0, 6).map(w => `<details><summary>${esc(w.date)} · ${w.words}단어</summary><div class="fb" style="padding-top:10px">${w.feedback ? `<div class="corrected">${esc(w.feedback.corrected)}</div>` : `<div class="corrected">${esc(w.text)}</div>`}</div></details>`).join("")}</div>` : ""}
  </section>`;
  const ta = $("#wt");
  const wc = () => { const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $("#wc").textContent = n + "단어"; return n; };
  wc();
  let saveT; ta.addEventListener("input", () => { wc(); clearTimeout(saveT); saveT = setTimeout(() => lsSet("e2m-draft", ta.value), 500); });
  $("#home").onclick = () => { clearInterval(writeTimer); go("home"); };
  $("#timer").onclick = () => {
    clearInterval(writeTimer); const end = Date.now() + 300000; ta.focus();
    writeTimer = setInterval(() => { const left = Math.max(0, Math.round((end - Date.now()) / 1000)); const el = $("#tm"); if (!el) { clearInterval(writeTimer); return; } el.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; if (!left) { clearInterval(writeTimer); el.textContent = "끝"; } }, 250);
  };
  $("#copy").onclick = () => {
    const text = `[주간 작문 ${today()}] 주제: ${topic}\n${ta.value}`;
    const fallback = () => { ta.focus(); ta.select(); $("#msg").textContent = "글이 선택되었습니다. 길게 눌러 복사하세요."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => { $("#copy").textContent = "복사됨"; }).catch(fallback); else fallback();
  };
  const fbBtn = $("#fbk");
  if (fbBtn) fbBtn.onclick = async () => {
    const text = ta.value.trim(); const words = wc();
    if (words < 15) { $("#msg").textContent = "15단어 이상 써야 교정할 거리가 생깁니다."; return; }
    fbBtn.disabled = true; $("#stop").hidden = false; $("#msg").textContent = "Claude가 읽는 중…";
    writeCtl = new AbortController();
    $("#stop").onclick = () => writeCtl && writeCtl.abort();
    const prompt = `You are an English writing coach for a Korean adult learner (intermediate; recognizes about 7,000 words but produces simple sentences). Their diagnosed recurring errors: using "had" as a general past-tense marker (e.g. "I had meet", "I had jogging"), dropping or misusing articles, present tense for past events, and wrong prepositions ("on 5 years").
Correct the learner's text below. Keep their meaning, voice and level; make it natural, not fancy.
Reply with only JSON in this shape:
{"corrected": "the full corrected text",
 "errors": [{"wrong": "learner's exact phrase", "right": "corrected phrase", "why": "one short Korean sentence"}],
 "drills": [{"ko": "natural Korean sentence", "en": "one sentence from the corrected text, 4-12 words"}],
 "comment": "two short Korean sentences: one strength, one focus for next week"}
Rules: at most 6 errors, most important first, prefer recurring patterns over one-off typos. Exactly 3 drills, chosen from sentences the learner got wrong.
Learner's text:
"""${text.slice(0, 4000)}"""`;
    try {
      const fb = await sample.json(prompt, { signal: writeCtl.signal });
      if (!fb || typeof fb.corrected !== "string") throw { code: "invalid_json" };
      fb.errors = Array.isArray(fb.errors) ? fb.errors.slice(0, 6) : [];
      fb.drills = Array.isArray(fb.drills) ? fb.drills.filter(x => x && x.ko && x.en).slice(0, 3) : [];
      const w = { id: "w-" + Date.now().toString(36), date: today(), topic, text, words, feedback: fb, createdAt: Date.now() };
      writings.unshift(w); lsSet(LS_W, writings); lsSet("e2m-draft", "");
      if (db) db.doc("writings/" + w.id).set(JSON.parse(JSON.stringify(w))).catch(() => {});
      $("#msg").textContent = "";
      showFeedback(w);
    } catch (e) {
      const code = e && e.code;
      $("#msg").textContent = code === "cancelled" ? "멈췄습니다." : code === "not_granted" || code === "sampling_disabled" ? "교정 기능을 쓸 수 없습니다. ‘글 복사’로 Claude와의 대화에 붙여 넣어 주세요." : code === "rate_limited" ? "요청이 많습니다. 잠시 뒤에 다시 눌러 주세요." : "교정을 받지 못했습니다. 다시 눌러 보거나 ‘글 복사’를 쓰세요.";
      if (code === "not_granted" || code === "sampling_disabled") fbBtn.hidden = true;
    } finally { fbBtn.disabled = false; $("#stop").hidden = true; }
  };
}
function showFeedback(w) {
  const fb = w.feedback;
  $("#fb").innerHTML = `<div class="fb">
    <h3>교정된 글</h3><div class="corrected">${esc(fb.corrected)}</div>
    ${fb.errors.length ? `<div><h3 style="margin-bottom:4px">고칠 점</h3>${fb.errors.map(x => `<div class="err"><span class="w">${esc(x.wrong)}</span><span class="r">${esc(x.right)}</span><span class="y">${esc(x.why)}</span></div>`).join("")}</div>` : ""}
    ${fb.comment ? `<div class="point">${esc(fb.comment)}</div>` : ""}
    ${fb.drills.length ? `<div class="stack-sm"><h3>내 문장으로 만든 순간영작 카드</h3>${fb.drills.map(d => `<div class="small"><b>${esc(d.ko)}</b><br><span class="en">${esc(d.en)}</span></div>`).join("")}
      <button class="btn btn-primary" id="addc">이 ${fb.drills.length}문장을 카드에 추가</button></div>` : ""}
  </div>`;
  const add = $("#addc");
  if (add) add.onclick = () => {
    progress.custom = progress.custom || [];
    fb.drills.forEach((d, k) => progress.custom.push({ id: `${w.id}-${k + 1}`, set: 0, ko: String(d.ko), en: String(d.en) }));
    persist("progress"); add.disabled = true; add.textContent = "추가됨 · 다음 순간영작부터 나옵니다";
  };
}

/* ───────────── Boot ───────────── */

function start() { render(); setFoot(); initStore(); }
document.addEventListener("visibilitychange", () => { if (document.hidden) stopActive(); else if (["ear", "mouth", "flow"].includes(view.name)) startActive(); });
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") window.claude.hot.snapshot(() => ({ view }));
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === "function") window.claude.hot.ready(d => { if (d && d.view) view = d.view; start(); });
else start();
})();
</script>
